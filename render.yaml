# Render Blueprint — static site, no build step.
# In Render: New ▸ Blueprint ▸ connect this repo, or New ▸ Static Site (settings below).
services:
  - type: web
    name: dashovia-cafe
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
