# Render Blueprint — Node web service that serves the static storefront AND
# provides the GitHub OAuth token exchange (/api/auth/github).
#
# In Render: New ▸ Blueprint ▸ connect this repo. After the first deploy, set the
# OAuth values below in the service's Environment tab (they are marked sync:false
# so they are NOT read from the repo — secrets never live in git).
services:
  - type: web
    name: dashovia-cafe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    pullRequestPreviewsEnabled: true
    envVars:
      # Public — exposed to the browser via /api/config
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      # Secret — server only, never sent to the browser
      - key: GITHUB_CLIENT_SECRET
        sync: false
